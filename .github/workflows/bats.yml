name: bats

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core, jq, and bash 5
        # netdiag's startup check exits 3 if bash 5 isn't at
        # /opt/homebrew/bin/bash or /usr/local/bin/bash, which makes the
        # --help smoke test fail on a stock runner.
        run: brew install bats-core jq bash
      - name: Run bats tests
        run: bats tests/

      # End-to-end smoke test. The runner's network is not our network, so
      # this asserts nothing about the findings — only that a real run
      # completes and emits parseable JSON. Exit 3 is the failure we care
      # about: it means the script itself broke, as opposed to 0/1/2 which
      # are verdicts about the runner's link.
      - name: Smoke test a real run
        run: |
          # Actions runs `bash -e`, and exit 1/2 are legitimate verdicts
          # about the runner's link, so guard the call rather than let -e
          # abort on a healthy result.
          status=0
          ./bin/netdiag --quick --no-gping --no-baseline --json > /tmp/smoke.json || status=$?
          echo "netdiag exit status: $status"
          if [ "$status" -eq 3 ]; then
            echo "::error::netdiag exited 3 (script error)"
            exit 1
          fi
          jq -e 'type == "object" and has("version") and has("diagnosis")' /tmp/smoke.json > /dev/null
          echo "emitted $(jq 'keys | length' /tmp/smoke.json) top-level keys"

      # The bats suite drives --history and --monitor through their pure
      # functions, which is where the logic is. These two steps cover the
      # part it deliberately can't: a real process, a real network, and a
      # real stream. Both are new surfaces the GUI depends on, so a break
      # here has to fail CI rather than surface as a blank menu-bar app.
      - name: Smoke test --history
        run: |
          ./bin/netdiag --quick --no-gping --quiet > /dev/null || true
          ./bin/netdiag --history > /tmp/history.json
          jq -e '
            has("networks") and has("runs") and has("metrics")
            and (.counts.records_read >= 1)
            and ([.networks[] | select(.id | startswith("[redacted]"))] | length == 0)
          ' /tmp/history.json > /dev/null
          echo "history: $(jq '.counts.runs' /tmp/history.json) runs across $(jq '.counts.networks' /tmp/history.json) network(s)"

      - name: Smoke test --monitor
        run: |
          # One object per line, each with the rule list the GUI renders.
          # --monitor-count bounds the run; without it this would hang CI.
          ./bin/netdiag --monitor --monitor-fast-interval 2 --monitor-count 3 > /tmp/monitor.jsonl
          [ "$(wc -l < /tmp/monitor.jsonl)" -eq 3 ]
          while IFS= read -r line; do
            printf '%s' "$line" | jq -e '
              has("schema") and has("status") and (.status.rules | type == "array")
              and (.link | has("up")) and (.network | has("id"))
            ' > /dev/null
          done < /tmp/monitor.jsonl
          echo "monitor: 3 valid samples, rules=$(jq -c '.status.rules' /tmp/monitor.jsonl | tr '\n' ' ')"

      - name: Smoke test --capabilities
        run: |
          ./bin/netdiag --version
          ./bin/netdiag --capabilities > /tmp/caps.json
          # jq is installed above, so deps.jq must be true here. The type
          # checks in bats can't catch a broken env-var wire between bash
          # and the helper — the document stays well-formed, just wrong —
          # so this asserts one real detection on a machine whose deps we
          # control.
          jq -e '
            has("schema") and has("schemas") and has("features")
            and (.deps.jq == true)
          ' /tmp/caps.json > /dev/null
          echo "capabilities: $(jq -c '.deps' /tmp/caps.json)"

      # jq is now optional everywhere except mtr's sudo-only per-hop path
      # and Tailscale VPN naming — the speed test's ~10 `jq -r` calls were
      # the last thing on the default path that hard-required it, and
      # those went through helpers/speedtest_result.py instead. This
      # proves the *run* survives jq failing; the parse math itself is
      # covered by tests/test_speedtest_parse.bats against fixtures, and
      # --quick skips the speed test regardless, so this is about the
      # rest of the run not tripping over a missing `command -v jq`
      # somewhere unexpected.
      #
      # A stub shadows `jq` earlier in PATH rather than trying to strip
      # brew's bin from PATH: real jq could be at /usr/local/bin (Intel)
      # or /opt/homebrew/bin (Apple Silicon) depending on the runner, and
      # bash/bats/other brew tools this job needs live in that same
      # directory, so removing it outright would risk breaking the step
      # for an unrelated reason. Shadowing only touches jq — which means
      # `command -v jq` still succeeds here: this step proves the run
      # survives jq *failing*, not jq being absent. A gate reintroduced
      # in either speed-test function is caught instead by the structural
      # tests in tests/test_speedtest_parse.bats.
      - name: Smoke test a run with a broken jq
        run: |
          mkdir -p /tmp/no-jq
          cat > /tmp/no-jq/jq <<'EOF'
          #!/bin/sh
          echo "jq: stubbed out for the no-jq smoke test" >&2
          exit 127
          EOF
          chmod +x /tmp/no-jq/jq

          status=0
          PATH="/tmp/no-jq:$PATH" command -v jq
          PATH="/tmp/no-jq:$PATH" ./bin/netdiag --json --quick --no-gping --no-baseline > /tmp/nojq.json || status=$?
          echo "netdiag exit status (broken jq): $status"
          if [ "$status" -eq 3 ]; then
            echo "::error::netdiag exited 3 with broken jq"
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open("/tmp/nojq.json"))'
          echo "no-jq run: stdout parsed as JSON"

      - name: Smoke test the installer
        run: |
          ./install.sh --prefix /tmp/ndbin --no-brew
          test -L /tmp/ndbin/netdiag
          /tmp/ndbin/netdiag --help > /dev/null
          ./install.sh --prefix /tmp/ndbin --uninstall
          test ! -e /tmp/ndbin/netdiag
