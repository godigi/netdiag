name: shellcheck

# Runs on a self-hosted runner (the VPS) — see godigi/vps2's
# deploy/gha-runners/README.md. ludeeus/action-shellcheck is a Docker-based
# action; running it would need the runner user in the `docker` group, which
# is root-equivalent. shellcheck is pre-installed on the runner host, so call
# it directly instead. bin/netdiag is extensionless (bash shebang, no .sh
# suffix) and would not be caught by a bare `*.sh` glob — same detection gap
# the previous action's shebang-scanning covered; listed explicitly here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        env:
          SHELLCHECK_OPTS: -x
        run: |
          mapfile -t files < <(git ls-files -- '*.sh' ':!tests/fixtures/*')
          files+=(bin/netdiag)
          printf 'checking %s\n' "${files[@]}"
          shellcheck "${files[@]}"
